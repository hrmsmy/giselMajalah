<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Majalah 3D Interaktif</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #090d16;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* --- BACKGROUND ANIMASI DINAMIS & ESTETIK --- */
        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            opacity: 0.3;
            animation: floatGlow 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bg-glow-1 {
            background: #3b82f6;
            top: -5%;
            left: -10%;
        }

        .bg-glow-2 {
            background: #8b5cf6;
            bottom: -5%;
            right: -10%;
            animation-delay: -6s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 30px) scale(1.1); }
            100% { transform: translate(-10px, -20px) scale(0.9); }
        }

        .bg-particles {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 1;
            pointer-events: none;
        }

        /* --- HEADER & ANIMASI BUBBLE --- */
        .bubble-anim {
            animation: bubbleFloat 3s ease-in-out infinite alternate;
        }

        @keyframes bubbleFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-3px); }
        }

        .bubble-sub-anim {
            animation: subBubbleFloat 2.8s ease-in-out infinite alternate;
            animation-delay: 0.2s;
        }

        @keyframes subBubbleFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-2px); }
        }

        /* Glassmorphism Panel Utama */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 25px 0 rgba(0, 0, 0, 0.5);
        }

        /* --- CONTAINER FLIPBOOK (DIBUAT STABIL TERKONTROL) --- */
        .flipbook-wrapper {
            position: relative;
            width: 100%;
            height: calc(100dvh - 160px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 0 10px;
            overflow: hidden;
        }

        .flip-book {
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: none;
            margin: auto;
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .page img {
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Invisible Tap Zones untuk Navigasi Layar HP */
        .tap-zone {
            position: fixed;
            top: 20%;
            bottom: 20%;
            width: 25%;
            z-index: 30;
            cursor: pointer;
        }
        .tap-zone-left { left: 0; }
        .tap-zone-right { right: 0; }

        /* Modern Equalizer Animation */
        .bar {
            width: 3px;
            background-color: #22d3ee;
            margin: 0 1.5px;
            border-radius: 2px;
            transition: height 0.2s ease;
        }
        .playing .bar {
            animation: sound 400ms -800ms linear infinite alternate;
        }
        .playing .bar:nth-child(1) { animation-delay: -200ms; }
        .playing .bar:nth-child(2) { animation-delay: -400ms; }
        .playing .bar:nth-child(3) { animation-delay: -600ms; }
        .playing .bar:nth-child(4) { animation-delay: -800ms; }
        
        @keyframes sound {
            0% { height: 3px; opacity: 0.4; }
            100% { height: 14px; opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Estetik -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="bg-particles"></div>

    <!-- Area Invisible Tap Kiri & Kanan untuk Navigasi Layar HP -->
    <div id="tap-left" class="tap-zone tap-zone-left"></div>
    <div id="tap-right" class="tap-zone tap-zone-right"></div>

    <!-- Header / Bagian Atas -->
    <header class="w-full pt-2 pb-1 px-3 text-center z-20 flex flex-col items-center justify-center pointer-events-none flex-shrink-0">
        <!-- Judul Utama -->
        <h1 class="bubble-anim text-lg sm:text-2xl font-black tracking-wide text-white drop-shadow-[0_2px_8px_rgba(0,0,0,0.6)] leading-tight">
            EH, KOK <span class="text-cyan-400 underline decoration-indigo-500 decoration-2 underline-offset-4">INTERNET</span> TAU?
        </h1>
        
        <!-- Sub-Judul -->
        <div class="bubble-sub-anim mt-1 px-2.5 py-0.5 rounded-lg bg-slate-900/80 backdrop-blur-md border border-white/10 shadow-md">
            <p class="text-[9px] sm:text-xs font-bold tracking-wider text-slate-200">
                <span class="text-yellow-400 font-extrabold">JEJAK DIGITAL</span> 
                <span class="text-slate-400 mx-0.5">DAN</span> 
                <span class="text-pink-400 font-extrabold">MASA DEPAN REMAJA</span>
            </p>
        </div>

        <!-- Nama Kelompok -->
        <div class="mt-1 px-2.5 py-0.5 rounded-full bg-slate-800/60 backdrop-blur-sm border border-white/10 shadow-sm">
            <p class="text-[9px] sm:text-[10px] font-semibold tracking-wide text-slate-300">
                kelompok 2 kokurikules <span class="text-cyan-400 font-extrabold">XII F7</span>
            </p>
        </div>
    </header>

    <!-- Wrapper Majalah STABIL -->
    <div class="flipbook-wrapper">
        <div id="flipbook" class="flip-book">
            
            <!-- Cover Depan -->
            <div class="page page-cover" data-density="hard">
                <img src="images/1.png" alt="Cover Depan">
            </div>

            <!-- Halaman Isi -->
            <div class="page">
                <img src="images/2.png" alt="Halaman 2">
            </div>
            <div class="page">
                <img src="images/3.png" alt="Halaman 3">
            </div>
            <div class="page">
                <img src="images/4.png" alt="Halaman 4">
            </div>

            <!-- Cover Belakang -->
            <div class="page page-cover" data-density="hard">
                <img src="images/5.png" alt="Cover Belakang">
            </div>

        </div>
    </div>

    <!-- File Audio -->
    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <!-- Widget Pemutar Musik Modern (CENTER Bottom) -->
    <footer class="w-full pb-3 pt-1 z-50 flex justify-center items-center flex-shrink-0">
        <div class="glass-panel rounded-full py-1.5 px-3.5 flex items-center gap-3 shadow-xl border border-white/20 bg-slate-900/90">
            
            <!-- Tombol Play / Pause -->
            <button id="play-btn" class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white flex justify-center items-center hover:opacity-95 transition-all shadow-md active:scale-95 focus:outline-none cursor-pointer flex-shrink-0">
                <i class="fas fa-play text-[10px] ml-0.5" id="play-icon"></i>
            </button>
            
            <!-- Informasi Lagu -->
            <div class="flex flex-col justify-center min-w-[75px] max-w-[120px] cursor-default text-left">
                <span class="text-xs font-bold text-white tracking-tight truncate">33x</span>
                <span class="text-[10px] font-medium text-cyan-300 tracking-wide truncate">Perunggu</span>
            </div>

            <!-- Equalizer Gelombang Audio -->
            <div id="equalizer" class="flex items-end h-3.5 ml-0.5 px-1 flex-shrink-0">
                <div class="bar" style="height: 3px;"></div>
                <div class="bar" style="height: 7px;"></div>
                <div class="bar" style="height: 4px;"></div>
                <div class="bar" style="height: 10px;"></div>
            </div>
        </div>
    </footer>

    <!-- Library StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const flipBookElement = document.getElementById('flipbook');
            
            // Konfigurasi Presisi untuk Stabilitas Layar HP
            const pageFlip = new St.PageFlip(flipBookElement, {
                width: 300,
                height: 420,
                size: "stretch",
                minWidth: 200,
                maxWidth: 600,
                minHeight: 280,
                maxHeight: 850,
                maxShadowOpacity: 0.35,
                showCover: true,
                mobileScrollSupport: false,
                usePortrait: true,
                startPage: 0,
                flippingTime: 600,
                swipeDistance: 20,
                clickEventEnabled: true
            });

            // Load Halaman
            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
            flipBookElement.style.display = 'block';

            // Menjaga Stabilitas Kerapihan saat Layar HP di-resize / Diputar
            window.addEventListener('resize', () => {
                pageFlip.updateFromHtml(document.querySelectorAll('.page'));
            });

            // Web Audio API Context
            let audioCtx = null;
            let flipBuffer = null;

            function initAudioContext() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            // Preload file flip.mp3
            function loadFlipSound() {
                fetch('flip.mp3')
                    .then(response => response.arrayBuffer())
                    .then(data => {
                        initAudioContext();
                        return audioCtx.decodeAudioData(data);
                    })
                    .then(buffer => {
                        flipBuffer = buffer;
                    })
                    .catch(err => console.error("Gagal memuat suara flip:", err));
            }

            loadFlipSound();

            function unlockAudio() {
                initAudioContext();
                window.removeEventListener('touchstart', unlockAudio);
                window.removeEventListener('click', unlockAudio);
            }
            window.addEventListener('touchstart', unlockAudio, { passive: true });
            window.addEventListener('click', unlockAudio, { passive: true });

            function playInstantFlipSound() {
                if (audioCtx && flipBuffer) {
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    const source = audioCtx.createBufferSource();
                    source.buffer = flipBuffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                }
            }

            pageFlip.on('changeState', function(e) {
                if (e.data === 'flipping') {
                    playInstantFlipSound();
                }
            });

            // Invisible Tap Zones (Tap area Kiri/Kanan layar HP)
            const tapLeft = document.getElementById('tap-left');
            const tapRight = document.getElementById('tap-right');

            tapLeft.addEventListener('click', (e) => {
                e.stopPropagation();
                pageFlip.flipPrev();
            });

            tapRight.addEventListener('click', (e) => {
                e.stopPropagation();
                pageFlip.flipNext();
            });

            // Navigasi Panah Keyboard
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') pageFlip.flipPrev();
                if (e.key === 'ArrowRight') pageFlip.flipNext();
            });

            // Player Musik
            const audio = document.getElementById('bg-music');
            const playBtn = document.getElementById('play-btn');
            const playIcon = document.getElementById('play-icon');
            const equalizer = document.getElementById('equalizer');

            playBtn.addEventListener('click', function() {
                initAudioContext();

                if (audio.paused) {
                    audio.play();
                    playIcon.classList.remove('fa-play', 'ml-0.5');
                    playIcon.classList.add('fa-pause');
                    equalizer.classList.add('playing');
                } else {
                    audio.pause();
                    playIcon.classList.remove('fa-pause');
                    playIcon.classList.add('fa-play', 'ml-0.5');
                    equalizer.classList.remove('playing');
                }
            });
        });
    </script>
</body>
</html>
