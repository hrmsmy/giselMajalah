<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Majalah 3D Interaktif</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.37);
        }

        /* Container Flipbook */
        .flipbook-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flip-book {
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: none;
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .page img {
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* Shading Bayangan Kertas */
        .page.--left {
            border-right: 1px solid rgba(0,0,0,0.12);
        }
        .page.--right {
            border-left: 1px solid rgba(0,0,0,0.12);
        }

        /* Invisible Tap Zones untuk Navigasi Layar (Kiri & Kanan) */
        .tap-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 25%;
            z-index: 30;
            cursor: pointer;
        }
        .tap-zone-left { left: 0; }
        .tap-zone-right { right: 0; }

        /* Equalizer Animation */
        .bar {
            width: 3px;
            background-color: #818cf8;
            margin: 0 1.5px;
            border-radius: 2px;
            transition: height 0.2s ease;
        }
        .playing .bar {
            animation: sound 400ms -800ms linear infinite alternate;
        }
        .playing .bar:nth-child(1) { animation-delay: -200ms; }
        .playing .bar:nth-child(2) { animation-delay: -400ms; }
        .playing .bar:nth-child(3) { animation-delay: -600ms; }
        .playing .bar:nth-child(4) { animation-delay: -800ms; }
        
        @keyframes sound {
            0% { height: 3px; opacity: 0.5; }
            100% { height: 16px; opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Area Invisible Tap Kiri & Kanan untuk Layar HP -->
    <div id="tap-left" class="tap-zone tap-zone-left"></div>
    <div id="tap-right" class="tap-zone tap-zone-right"></div>

    <div class="flipbook-wrapper px-2 py-12 md:p-8">
        <!-- Container Flipbook -->
        <div id="flipbook" class="flip-book">
            
            <!-- Cover Depan -->
            <div class="page page-cover" data-density="hard">
                <img src="images/1.png" alt="Cover Depan" class="w-full h-full object-cover">
            </div>

            <!-- Halaman Isi -->
            <div class="page">
                <img src="images/2.png" alt="Halaman 2" class="w-full h-full object-cover">
            </div>
            <div class="page">
                <img src="images/3.png" alt="Halaman 3" class="w-full h-full object-cover">
            </div>
            <div class="page">
                <img src="images/4.png" alt="Halaman 4" class="w-full h-full object-cover">
            </div>

            <!-- Cover Belakang -->
            <div class="page page-cover" data-density="hard">
                <img src="images/5.png" alt="Cover Belakang" class="w-full h-full object-cover">
            </div>

        </div>
    </div>

    <!-- File Audio (Di-preload penuh agar instant tanpa delay) -->
    <audio id="bg-music" src="music.mp3" loop></audio>
    <audio id="sound-flip" src="flip.mp3" preload="auto"></audio>

    <!-- Widget Pemutar Musik -->
    <div class="fixed bottom-4 right-4 md:bottom-6 md:right-6 glass-panel rounded-2xl p-2.5 px-3.5 flex items-center gap-3 z-50 transition-all hover:scale-105">
        
        <button id="play-btn" class="w-10 h-10 md:w-11 md:h-11 rounded-full bg-indigo-600 text-white flex justify-center items-center hover:bg-indigo-500 transition shadow-lg focus:outline-none">
            <i class="fas fa-play text-sm ml-0.5" id="play-icon"></i>
        </button>
        
        <div class="flex flex-col w-28 md:w-36 cursor-default">
            <span class="text-xs md:text-sm font-semibold text-slate-100 truncate">33x</span>
            <span class="text-[10px] md:text-xs text-slate-400 truncate">Perunggu</span>
        </div>

        <div id="equalizer" class="flex items-end h-4 ml-1">
            <div class="bar" style="height: 3px;"></div>
            <div class="bar" style="height: 6px;"></div>
            <div class="bar" style="height: 4px;"></div>
            <div class="bar" style="height: 8px;"></div>
        </div>
    </div>

    <!-- Library StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const flipBookElement = document.getElementById('flipbook');
            
            // Inisialisasi PageFlip
            const pageFlip = new St.PageFlip(flipBookElement, {
                width: 450,
                height: 600,
                size: "stretch",
                minWidth: 280,
                maxWidth: 900,
                minHeight: 380,
                maxHeight: 1200,
                maxShadowOpacity: 0.4,
                showCover: true,
                mobileScrollSupport: false,
                usePortrait: true,
                flippingTime: 700
            });

            // Load Halaman
            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
            flipBookElement.style.display = 'block';

            // Web Audio API Context untuk memutar suara kertas tanpa delay sama sekali
            let audioCtx = null;
            let flipBuffer = null;

            // Load audio buffer menggunakan Web Audio API
            fetch('flip.mp3')
                .then(response => response.arrayBuffer())
                .then(data => {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                    return audioCtx.decodeAudioData(data);
                })
                .then(buffer => {
                    flipBuffer = buffer;
                })
                .catch(err => console.log('Menggunakan audio tag fallback'));

            // Fungsi memutar suara flip instan
            function playInstantFlipSound() {
                if (audioCtx && flipBuffer) {
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    const source = audioCtx.createBufferSource();
                    source.buffer = flipBuffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                } else {
                    // Fallback
                    const soundFlip = document.getElementById('sound-flip');
                    if (soundFlip) {
                        soundFlip.currentTime = 0;
                        soundFlip.play().catch(() => {});
                    }
                }
            }

            // Pemicu Suara Flip (Dipicu langsung saat status flip berubah)
            pageFlip.on('changeState', function(e) {
                if (e.data === 'flipping') {
                    playInstantFlipSound();
                }
            });

            // Invisible Tap Zones (Tap area Kiri/Kanan layar HP tanpa tombol visual)
            const tapLeft = document.getElementById('tap-left');
            const tapRight = document.getElementById('tap-right');

            tapLeft.addEventListener('click', (e) => {
                e.stopPropagation();
                pageFlip.flipPrev();
            });

            tapRight.addEventListener('click', (e) => {
                e.stopPropagation();
                pageFlip.flipNext();
            });

            // Navigasi Panah Keyboard
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') pageFlip.flipPrev();
                if (e.key === 'ArrowRight') pageFlip.flipNext();
            });

            // Player Musik (Juga mengaktifkan AudioContext jika belum aktif)
            const audio = document.getElementById('bg-music');
            const playBtn = document.getElementById('play-btn');
            const playIcon = document.getElementById('play-icon');
            const equalizer = document.getElementById('equalizer');

            playBtn.addEventListener('click', function() {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                if (audio.paused) {
                    audio.play();
                    playIcon.classList.remove('fa-play', 'ml-0.5');
                    playIcon.classList.add('fa-pause');
                    equalizer.classList.add('playing');
                } else {
                    audio.pause();
                    playIcon.classList.remove('fa-pause');
                    playIcon.classList.add('fa-play', 'ml-0.5');
                    equalizer.classList.remove('playing');
                }
            });
        });
    </script>
</body>
</html>
