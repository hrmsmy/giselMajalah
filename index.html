<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no"
    />
    <title>Majalah 3D Interaktif</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Font Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
        background-color: #061f14; /* Latar belakang hijau sangat gelap */
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        position: relative;
      }

      /* --- BACKGROUND ANIMASI DINAMIS & TEMA HIJAU --- */
      .bg-glow-1,
      .bg-glow-2 {
        position: absolute;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        filter: blur(70px);
        z-index: 0;
        opacity: 0.4;
        animation: floatGlow 15s ease-in-out infinite alternate;
        pointer-events: none;
      }

      .bg-glow-1 {
        background: #10b981; /* Emerald green */
        top: -10%;
        left: -15%;
      }

      .bg-glow-2 {
        background: #059669; /* Darker emerald */
        bottom: -5%;
        right: -10%;
        animation-delay: -7s;
      }

      @keyframes floatGlow {
        0% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(30px, 40px) scale(1.15);
        }
        100% {
          transform: translate(-15px, -25px) scale(0.85);
        }
      }

      /* Hiasan Bubble Blur Estetik di Background */
      .bubble-bg-1, .bubble-bg-2, .bubble-bg-3 {
        position: absolute;
        border-radius: 50%;
        background: rgba(52, 211, 153, 0.15); /* Soft green bubble */
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        z-index: 1;
        pointer-events: none;
        animation: floatBubble 10s ease-in-out infinite alternate;
      }

      .bubble-bg-1 {
        width: 80px;
        height: 80px;
        top: 20%;
        left: 5%;
        animation-duration: 12s;
      }

      .bubble-bg-2 {
        width: 120px;
        height: 120px;
        bottom: 25%;
        right: -5%;
        animation-duration: 14s;
        animation-delay: -3s;
      }

      .bubble-bg-3 {
        width: 60px;
        height: 60px;
        top: 50%;
        left: 15%;
        animation-duration: 9s;
        animation-delay: -6s;
      }

      @keyframes floatBubble {
        0% { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(-40px) rotate(10deg); }
      }

      .bg-particles {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgba(16, 185, 129, 0.15) 1px, /* Green particles */
          transparent 1px
        );
        background-size: 25px 25px;
        z-index: 1;
        pointer-events: none;
      }

      /* --- HEADER & ANIMASI BUBBLE --- */
      .bubble-anim {
        animation: bubbleFloat 3s ease-in-out infinite alternate;
      }

      @keyframes bubbleFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }

      .bubble-sub-anim {
        animation: subBubbleFloat 2.8s ease-in-out infinite alternate;
        animation-delay: 0.2s;
      }

      @keyframes subBubbleFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-2px); }
      }

      /* Glassmorphism Panel Utama */
      .glass-panel {
        background: rgba(6, 78, 59, 0.6); /* Dark green glass */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(16, 185, 129, 0.2); /* Emerald border */
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
      }

      /* --- CONTAINER FLIPBOOK & EFEK 3D BUKU --- */
      .flipbook-wrapper {
        position: relative;
        width: 100%;
        max-width: 390px;
        flex: 1 1 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        padding: 0 10px; /* Sedikit padding agar bayangan terlihat */
        overflow: visible; /* Penting untuk bayangan 3D */
      }

      /* Efek 3D Book Spine & Shadow (Berada di belakang buku) */
      .book-3d-backdrop {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: calc(100% - 20px); /* Menyesuaikan dengan padding wrapper */
        height: 85%; /* Sedikit lebih kecil dari buku aslinya (akan disesuaikan JS) */
        max-width: 310px; /* Lebar maksimal default St.PageFlip */
        z-index: -1;
        background: #022c22;
        border-radius: 4px;
        box-shadow: 
          -15px 15px 30px rgba(0, 0, 0, 0.8), /* Bayangan utama tebal ke kiri bawah */
          0 0 20px rgba(16, 185, 129, 0.2); /* Glow hijau halus */
        transition: all 0.3s ease;
      }
      
      /* Simulasi Ketebalan/Tulang Buku di sebelah kiri */
      .book-3d-backdrop::before {
        content: '';
        position: absolute;
        top: 0;
        left: -8px; /* Ketebalan buku */
        width: 8px;
        height: 100%;
        background: linear-gradient(to right, #064e3b, #022c22);
        border-radius: 4px 0 0 4px;
        border-left: 1px solid rgba(255,255,255,0.1);
        transform-origin: right;
        transform: perspective(600px) rotateY(-30deg);
      }

      .flip-book {
        /* Hapus shadow asli karena sudah diganti book-3d-backdrop */
        display: none;
        margin: auto;
        z-index: 5;
      }

      .page {
        background-color: #ffffff;
        overflow: hidden;
        position: relative;
      }

      /* Efek pencahayaan pada halaman untuk menambah dimensi */
      .page::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(0,0,0,0.05) 0%, transparent 5%, transparent 95%, rgba(0,0,0,0.05) 100%);
        pointer-events: none;
      }

      .page img {
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Invisible Tap Zones untuk Navigasi Layar HP */
      .tap-zone {
        position: fixed;
        top: 20%;
        bottom: 20%;
        width: 25%;
        z-index: 30;
        cursor: pointer;
      }
      .tap-zone-left {
        left: 0;
      }
      .tap-zone-right {
        right: 0;
      }

      /* Modern Equalizer Animation (Hijau) */
      .bar {
        width: 3px;
        background-color: #34d399; /* Emerald 400 */
        margin: 0 1.5px;
        border-radius: 2px;
        transition: height 0.2s ease;
      }
      .playing .bar {
        animation: sound 400ms -800ms linear infinite alternate;
      }
      .playing .bar:nth-child(1) { animation-delay: -200ms; }
      .playing .bar:nth-child(2) { animation-delay: -400ms; }
      .playing .bar:nth-child(3) { animation-delay: -600ms; }
      .playing .bar:nth-child(4) { animation-delay: -800ms; }

      @keyframes sound {
        0% { height: 3px; opacity: 0.4; }
        100% { height: 14px; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Latar Belakang Estetik & Tema Hijau -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="bg-particles"></div>
    
    <!-- Elemen Bubble Blur -->
    <div class="bubble-bg-1"></div>
    <div class="bubble-bg-2"></div>
    <div class="bubble-bg-3"></div>

    <!-- Area Invisible Tap Kiri & Kanan untuk Navigasi Layar HP -->
    <div id="tap-left" class="tap-zone tap-zone-left"></div>
    <div id="tap-right" class="tap-zone tap-zone-right"></div>

    <!-- Header / Bagian Atas (DITURUNKAN SEDIKIT dengan pt-8) -->
    <header
      class="w-full pt-8 pb-1 px-3 text-center z-20 flex flex-col items-center justify-center pointer-events-none flex-shrink-0"
    >
      <!-- Judul Utama -->
      <h1
        class="bubble-anim text-base font-black tracking-wide text-white drop-shadow-[0_2px_8px_rgba(0,0,0,0.6)] leading-tight"
      >
        EH, KOK
        <span
          class="text-emerald-400 underline decoration-teal-500 decoration-2 underline-offset-4"
          >INTERNET</span
        >
        TAU?
      </h1>

      <!-- Sub-Judul -->
      <div
        class="bubble-sub-anim mt-1 px-2.5 py-0.5 rounded-lg bg-green-950/80 backdrop-blur-md border border-emerald-500/30 shadow-[0_4px_15px_rgba(16,185,129,0.2)]"
      >
        <p class="text-[9px] font-bold tracking-wider text-emerald-100">
          <span class="text-yellow-300 font-extrabold">JEJAK DIGITAL</span>
          <span class="text-emerald-300/80 mx-0.5">DAN</span>
          <span class="text-teal-300 font-extrabold">MASA DEPAN REMAJA</span>
        </p>
      </div>
    </header>

    <!-- Wrapper Majalah PRESISI HP 360px - 390px -->
    <div class="flipbook-wrapper">
      <!-- Latar Belakang 3D Buku (Bayangan & Tulang Buku) -->
      <div id="book-3d-bg" class="book-3d-backdrop"></div>
      
      <div id="flipbook" class="flip-book">
        <!-- Cover Depan -->
        <div class="page page-cover" data-density="hard">
          <img src="images/1.jpeg" alt="Cover Depan" />
        </div>

        <!-- Halaman Isi -->
        <div class="page"><img src="images/2.jpeg" alt="Halaman 2" /></div>
        <div class="page"><img src="images/3.jpeg" alt="Halaman 3" /></div>
        <div class="page"><img src="images/4.jpeg" alt="Halaman 4" /></div>
        <div class="page"><img src="images/5.jpeg" alt="Halaman 5" /></div>
        <div class="page"><img src="images/6.jpeg" alt="Halaman 6" /></div>
        <div class="page"><img src="images/7.jpeg" alt="Halaman 7" /></div>
        <div class="page"><img src="images/8.jpeg" alt="Halaman 8" /></div>
        <div class="page"><img src="images/9.jpeg" alt="Halaman 9" /></div>
        <div class="page"><img src="images/10.jpeg" alt="Halaman 10" /></div>
        <div class="page"><img src="images/11.jpeg" alt="Halaman 11" /></div>

        <!-- Cover Belakang -->
        <div class="page page-cover" data-density="hard">
          <img src="images/12.jpeg" alt="Cover Belakang" />
        </div>
      </div>
    </div>

    <!-- File Audio -->
    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <!-- Footer: Nama Kelompok (Kiri) dan Widget Musik (Kanan) Sejajar -->
    <footer
      class="w-full px-3 pb-3 pt-1 z-50 flex justify-between items-center flex-shrink-0"
    >
      <!-- Nama Kelompok (Tema Hijau) -->
      <div
        class="glass-panel px-2.5 py-1.5 rounded-full flex items-center"
      >
        <p
          class="text-[9px] font-semibold tracking-wide text-emerald-100 whitespace-nowrap"
        >
          kelompok 2 kokurikules
          <span class="text-emerald-400 font-extrabold ml-1">XII F7</span>
        </p>
      </div>

      <!-- Widget Pemutar Musik Modern (Tema Hijau) -->
      <div
        class="glass-panel rounded-full py-1 px-2.5 flex items-center gap-2"
      >
        <!-- Tombol Play / Pause -->
        <button
          id="play-btn"
          class="w-6 h-6 rounded-full bg-gradient-to-br from-emerald-400 to-teal-600 text-white flex justify-center items-center hover:opacity-90 transition-all shadow-md active:scale-95 focus:outline-none cursor-pointer flex-shrink-0"
        >
          <i class="fas fa-play text-[8px] ml-0.5" id="play-icon"></i>
        </button>

        <!-- Informasi Lagu -->
        <div
          class="flex flex-col justify-center min-w-[50px] max-w-[80px] cursor-default text-left"
        >
          <span class="text-[10px] font-bold text-white tracking-tight truncate"
            >Happy!</span
          >
          <span
            class="text-[8px] font-medium text-emerald-300 tracking-wide truncate"
            >Mocca</span
          >
        </div>

        <!-- Equalizer Gelombang Audio -->
        <div id="equalizer" class="flex items-end h-2.5 px-0.5 flex-shrink-0">
          <div class="bar" style="height: 3px"></div>
          <div class="bar" style="height: 6px"></div>
          <div class="bar" style="height: 4px"></div>
          <div class="bar" style="height: 8px"></div>
        </div>
      </div>
    </footer>

    <!-- Library StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const flipBookElement = document.getElementById("flipbook");
        const book3dBg = document.getElementById("book-3d-bg");

        // Ukuran khusus untuk layar HP 360px - 390px
        const pageFlip = new St.PageFlip(flipBookElement, {
          width: 310,
          height: 430,
          size: "stretch",
          minWidth: 260,
          maxWidth: 390,
          minHeight: 360,
          maxHeight: 560,
          maxShadowOpacity: 0.35,
          showCover: true,
          mobileScrollSupport: false,
          usePortrait: true,
          startPage: 0,
          flippingTime: 600,
          swipeDistance: 20,
          clickEventEnabled: true,
        });

        // Load Halaman
        pageFlip.loadFromHTML(document.querySelectorAll(".page"));
        flipBookElement.style.display = "block";

        // Sinkronisasi ukuran backdrop 3D dengan ukuran buku yang sedang aktif
        function update3DBackdrop() {
           // Mengambil dimensi buku yang sedang di-render
           const bookBounds = pageFlip.getBoundsRect();
           if(bookBounds && bookBounds.width > 0) {
               // Sesuaikan ukuran backdrop agar sedikit lebih kecil dari buku aslinya untuk efek bayangan
               book3dBg.style.width = (bookBounds.width) + 'px';
               book3dBg.style.height = (bookBounds.height) + 'px';
           }
        }

        pageFlip.on("init", () => {
            setTimeout(update3DBackdrop, 100); // Tunggu render awal
        });

        // Menjaga Stabilitas Kerapihan saat Layar HP di-resize / Diputar
        window.addEventListener("resize", () => {
          pageFlip.updateFromHtml(document.querySelectorAll(".page"));
          setTimeout(update3DBackdrop, 100);
        });

        // Efek dinamis: Ubah arah bayangan saat membalik halaman (Opsional, untuk menambah realisme)
        pageFlip.on("changeState", function (e) {
          if (e.data === "flipping") {
             book3dBg.style.transform = "translate(-50%, -50%) scale(0.98)";
          } else {
             book3dBg.style.transform = "translate(-50%, -50%) scale(1)";
          }
        });

        // Web Audio API Context
        let audioCtx = null;
        let flipBuffer = null;

        function initAudioContext() {
          if (!audioCtx) {
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
        }

        // Preload file flip.mp3
        function loadFlipSound() {
          fetch("flip.mp3")
            .then((response) => response.arrayBuffer())
            .then((data) => {
              initAudioContext();
              return audioCtx.decodeAudioData(data);
            })
            .then((buffer) => {
              flipBuffer = buffer;
            })
            .catch((err) => console.error("Gagal memuat suara flip:", err));
        }

        loadFlipSound();

        function unlockAudio() {
          initAudioContext();
          window.removeEventListener("touchstart", unlockAudio);
          window.removeEventListener("click", unlockAudio);
        }
        window.addEventListener("touchstart", unlockAudio, { passive: true });
        window.addEventListener("click", unlockAudio, { passive: true });

        function playInstantFlipSound() {
          if (audioCtx && flipBuffer) {
            if (audioCtx.state === "suspended") {
              audioCtx.resume();
            }
            const source = audioCtx.createBufferSource();
            source.buffer = flipBuffer;
            source.connect(audioCtx.destination);
            source.start(0);
          }
        }

        pageFlip.on("changeState", function (e) {
          if (e.data === "flipping") {
            playInstantFlipSound();
          }
        });

        // Invisible Tap Zones (Tap area Kiri/Kanan layar HP)
        const tapLeft = document.getElementById("tap-left");
        const tapRight = document.getElementById("tap-right");

        tapLeft.addEventListener("click", (e) => {
          e.stopPropagation();
          pageFlip.flipPrev();
        });

        tapRight.addEventListener("click", (e) => {
          e.stopPropagation();
          pageFlip.flipNext();
        });

        // Navigasi Panah Keyboard
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft") pageFlip.flipPrev();
          if (e.key === "ArrowRight") pageFlip.flipNext();
        });

        // Player Musik
        const audio = document.getElementById("bg-music");
        const playBtn = document.getElementById("play-btn");
        const playIcon = document.getElementById("play-icon");
        const equalizer = document.getElementById("equalizer");

        playBtn.addEventListener("click", function () {
          initAudioContext();

          if (audio.paused) {
            audio.play();
            playIcon.classList.remove("fa-play", "ml-0.5");
            playIcon.classList.add("fa-pause");
            equalizer.classList.add("playing");
          } else {
            audio.pause();
            playIcon.classList.remove("fa-pause");
            playIcon.classList.add("fa-play", "ml-0.5");
            equalizer.classList.remove("playing");
          }
        });
      });
    </script>
  </body>
</html>
